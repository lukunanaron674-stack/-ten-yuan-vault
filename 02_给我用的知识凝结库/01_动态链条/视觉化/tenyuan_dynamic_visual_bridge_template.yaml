version: 1.0
name: Ten-Yuan Dynamic Chain -> Visual Operations Bridge
status: template_only

rules:
  - Never infer or modify Ten-Yuan theory from image results.
  - Only populate ten_yuan_chain fields from already-confirmed theory records.
  - Visual operations are implementation primitives, not ontology labels.
  - One chain may call 1-3 visual operations with unequal weights.
  - primary operation must carry the dominant visible structural change.
  - secondary operation may alter the manner of change but must not erase the primary.

