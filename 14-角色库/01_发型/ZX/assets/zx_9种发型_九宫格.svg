<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <defs>
    <style>
      .panel{fill:#f7f4ee;stroke:#2b2b2b;stroke-width:4}
      .skin{fill:#f2c7ad;stroke:#2b2b2b;stroke-width:5}
      .neck{fill:#eeb99d;stroke:#2b2b2b;stroke-width:4}
      .shirt{fill:#30343b;stroke:#2b2b2b;stroke-width:4}
      .hair{fill:#17191f;stroke:#0b0c10;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .hair2{fill:none;stroke:#2f3542;stroke-width:8;stroke-linecap:round}
      .line{fill:none;stroke:#2b2b2b;stroke-width:5;stroke-linecap:round}
      .num{font:700 54px Arial, sans-serif;fill:#2b2b2b}
      .label{font:700 34px Arial, sans-serif;fill:#2b2b2b}
      .sub{font:500 24px Arial, sans-serif;fill:#57534e}
    </style>
  </defs>

  <rect width="1800" height="1800" fill="#ded8cc"/>

