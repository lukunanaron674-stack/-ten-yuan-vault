 <text x="112" y="848" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#293548">试点误区提醒</text>
 <text x="112" y="882" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#455468">排除帽子/雨帽等配件；动作、衣褶和鞋尖不等于骨点。头身比只描述外轮廓，不能单独推出 331 / 575 / 851 等身体分区假设。</text>
 <text x="80" y="936" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#798493">估算仅供本轮筛选；十元比例映射保持候选/待判，后续需正面中立灰膜控制变量。</text>
