 <text x="82" y="140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#566273">头部长度记作 1 单位；按可见头顶到脚底粗估。横轴是头身数，不是十元类型。</text>
