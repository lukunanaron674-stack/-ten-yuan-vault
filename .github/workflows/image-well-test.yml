name: image-well-test

on:
  push:
    paths:
      - '.github/workflows/image-well-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault sparsely
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            黎黎隆项目
          sparse-checkout-cone-mode: false

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Fetch image-well upstream
        run: |
          git clone --depth 1 https://github.com/tdimino/claude-code-minoan.git /tmp/minoan

      - name: Search and download refs
        run: |
          OUT='黎黎隆项目/场景视觉参考/image-well-test/I04_骨骼空港'
          rm -rf "$OUT"
          mkdir -p "$OUT/q1" "$OUT/q2" "$OUT/q3"

          uv run /tmp/minoan/skills/design-media/image-well/scripts/well.py search "whale skeleton" \
            --sources openverse wikimedia --limit 3 --format download --output "$OUT/q1" || true
          uv run /tmp/minoan/skills/design-media/image-well/scripts/well.py search "rib cage skeleton" \
            --sources openverse wikimedia --limit 3 --format download --output "$OUT/q2" || true
          uv run /tmp/minoan/skills/design-media/image-well/scripts/well.py search "skeleton museum" \
            --sources openverse wikimedia --limit 3 --format download --output "$OUT/q3" || true

          COUNT=$(find "$OUT" -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l)
          echo "downloaded image count=$COUNT"
          find "$OUT" -maxdepth 3 -type f -print
          test "$COUNT" -gt 0

      - name: Build local-preview Canvas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('黎黎隆项目/场景视觉参考/image-well-test/I04_骨骼空港')
          imgs = sorted([p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.gif'}])[:6]
          if not imgs:
              raise SystemExit('no images downloaded')

          nodes = [{
              'id':'root','type':'text',
              'text':'# image-well 试跑｜I04 骨骼空港\n\n三组查询：whale skeleton / rib cage skeleton / skeleton museum\n来源：Openverse + Wikimedia\n\n验证：无登录搜索 → 本地下载 → Canvas type:file。',
              'x':0,'y':0,'width':760,'height':300,'color':'5'
          }]
          edges=[]
          for i,p in enumerate(imgs):
              x = -650 + (i%3)*680
              y = 380 + (i//3)*520
              nid=f'img_{i+1}'
              nodes.append({'id':nid,'type':'file','file':p.as_posix(),'x':x,'y':y,'width':600,'height':430,'color':'6'})
              edges.append({'id':f'e{i+1}','fromNode':'root','toNode':nid,'fromSide':'bottom','toSide':'top','label':'无登录本地参考'})

          nodes.append({
              'id':'note','type':'text',
              'text':f'## 试跑成功\n\nCanvas 引用本地图：{len(imgs)} 张\n\n`type:link`：0\nPinterest 登录：0\n\n这只是检验采集管线，图片是否适合“骨骼空港”还要再做视觉筛选。',
              'x':0,'y':1450,'width':760,'height':300,'color':'2'
          })
          out = root/'I04_骨骼空港_imagewell_test.canvas'
          out.write_text(json.dumps({'nodes':nodes,'edges':edges},ensure_ascii=False,indent=2),encoding='utf-8')
          print('canvas:', out)
          print('images:', len(imgs))
          PY

      - name: Commit test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '黎黎隆项目/场景视觉参考/image-well-test/I04_骨骼空港'
          git commit -m '[skip ci] image-well I04 broader-query proof'
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-well-I04-test
          path: '黎黎隆项目/场景视觉参考/image-well-test/I04_骨骼空港'
