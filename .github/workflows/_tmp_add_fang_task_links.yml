name: temp-add-fang-task-links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MD task-card nodes to original canvases
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          def recover_first_canvas_if_needed(path: pathlib.Path):
              raw = path.read_text(encoding='utf-8')
              try:
                  return json.loads(raw), False
              except json.JSONDecodeError:
                  # 当前 1.canvas 若因历史合并/恢复产生语法损坏，回溯最近的“完整且可解析”版本。
                  # 为避免回到后来的精简重做版，要求节点数 >= 20，优先保留原始大画布。
                  commits = subprocess.check_output(
                      ['git', 'rev-list', 'HEAD^', '--', str(path)], text=True
                  ).splitlines()
                  for sha in commits:
                      try:
                          old = subprocess.check_output(
                              ['git', 'show', f'{sha}:{path}'], text=True, stderr=subprocess.DEVNULL
                          )
                          data = json.loads(old)
                      except Exception:
                          continue
                      if len(data.get('nodes', [])) >= 20:
                          print(f'Recovering invalid {path} from valid full canvas at {sha}')
                          return data, True
                  raise RuntimeError(f'{path} is invalid JSON and no valid full historical canvas was found')

          def load_canvas(path_str):
              path = pathlib.Path(path_str)
              if path_str == '1.canvas':
                  return path, *recover_first_canvas_if_needed(path)
              raw = path.read_text(encoding='utf-8')
              return path, json.loads(raw), False

          def add_file_nodes(path_str, specs):
              path, data, recovered = load_canvas(path_str)
              nodes = data.setdefault('nodes', [])
              existing_files = {n.get('file') for n in nodes if n.get('type') == 'file'}
              existing_ids = {n.get('id') for n in nodes}
              changed = recovered
              for spec in specs:
                  if spec['file'] in existing_files or spec['id'] in existing_ids:
                      continue
                  nodes.append(spec)
                  changed = True
              if changed:
                  path.write_text(json.dumps(data, ensure_ascii=False, indent='\t') + '\n', encoding='utf-8')
                  print(f'Updated {path_str}')
              else:
                  print(f'No change needed for {path_str}')

          add_file_nodes('1.canvas', [
              {
                  'id': 'taskcard_link_act1', 'type': 'file', 'file': '第一幕_任务卡.md',
                  'x': 6860, 'y': -850, 'width': 520, 'height': 420
              }
          ])

          add_file_nodes('第二幕方志敏.canvas', [
              {
                  'id': 'taskcard_link_act2', 'type': 'file', 'file': '第二幕_任务卡.md',
                  'x': 5200, 'y': 330, 'width': 520, 'height': 420
              }
          ])

          add_file_nodes('第三幕方志敏.canvas', [
              {
                  'id': 'taskcard_link_act3_01', 'type': 'file', 'file': '第三幕_01_狱中传播.md',
                  'x': 6550, 'y': 360, 'width': 520, 'height': 360
              },
              {
                  'id': 'taskcard_link_act3_02', 'type': 'file', 'file': '第三幕_02_告密与传递.md',
                  'x': 6550, 'y': 780, 'width': 520, 'height': 360
              },
              {
                  'id': 'taskcard_link_act3_03', 'type': 'file', 'file': '第三幕_03_意义越狱抽象.md',
                  'x': 6550, 'y': 1200, 'width': 520, 'height': 360
              },
              {
                  'id': 'taskcard_link_act3_04', 'type': 'file', 'file': '第三幕_04_终局.md',
                  'x': 6550, 'y': 1620, 'width': 520, 'height': 360
              }
          ])
          PY

      - name: Commit patched canvases
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '1.canvas' '第二幕方志敏.canvas' '第三幕方志敏.canvas'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "在三幕原Canvas加入AI任务卡MD链接"
          git push
