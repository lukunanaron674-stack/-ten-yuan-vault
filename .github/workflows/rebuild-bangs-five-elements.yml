name: Rebuild bangs five-element research canvases

on:
  push:
    branches: [main]
    paths:
      - '14-角色库/刘海98种/**'
      - '.github/workflows/rebuild-bangs-five-elements.yml'
  pull_request:
    branches: [main]
    paths:
      - '14-角色库/刘海98种/**'
      - '.github/workflows/rebuild-bangs-five-elements.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip bangs-rebuild]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Rebuild canvases and structural audit
        run: python '14-角色库/刘海98种/tools/rebuild_five_element_canvases.py'
      - name: Apply confirmed source fixes
        run: python '14-角色库/刘海98种/tools/apply_reference_source_fixes.py'
      - name: Apply narrative is-a narrow inheritance
        run: python '14-角色库/刘海98种/tools/apply_is_a_narrow_semantics.py'
      - name: Apply ten-yuan mapping degree
        run: python '14-角色库/刘海98种/tools/apply_ten_yuan_mapping_degree.py'
      - name: Check image and source links
        run: python '14-角色库/刘海98种/tools/check_reference_links.py'
      - name: Reject conflict markers
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' '14-角色库/刘海98种' --include='*.canvas' --include='*.md'; then
            echo 'Git conflict markers found.'
            exit 1
          fi
      - name: Commit generated views
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '14-角色库/刘海98种/批次14_复古与造型型刘海.canvas' \
                  '14-角色库/刘海98种/02_五行十元重组/五行库' \
                  '14-角色库/刘海98种/02_五行十元重组/02_图片与结构审计报告.md' \
                  '14-角色库/刘海98种/02_五行十元重组/04_外链可用性报告.md'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m '重建刘海五行研究卡、is-a狭义、十元映射度与来源审计 [skip bangs-rebuild]'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
