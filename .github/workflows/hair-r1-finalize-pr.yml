name: Hair R1 Finalize Source Pool

on:
  pull_request:
    branches: [main]
    paths:
      - '05-银矿库/角色库/发型库总表/.r1-finalize-trigger'

permissions:
  contents: write

jobs:
  finalize-r1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            05-银矿库/角色库/发型库总表
          sparse-checkout-cone-mode: false

      - name: Build selected pool and Canvas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          root = Path('05-银矿库/角色库/发型库总表')
          cand = root / 'assets/refs/r1_china_source_pool/candidates'
          sel = root / 'assets/refs/r1_china_source_pool/selected'
          sel.mkdir(parents=True, exist_ok=True)

          items = [
            ('01','01_公主切.jpg','01_经典中分公主切.jpg','经典中分公主切','公主切','美发站','https://www.meifazhan.com/lxfx/liuhai/186605.html','中分打开额面，下颌位置形成整齐侧片，长直发主体完整。'),
            ('02','02_公主切.jpg','02_雾棕齐刘海公主切.jpg','雾棕齐刘海公主切','公主切','美发站','https://www.meifazhan.com/lxfx/liuhai/186605.html','齐刘海与雾棕长直发结合，侧片柔化，适合观察发色与硬切线的平衡。'),
            ('03','03_公主切.jpg','03_自然长侧片公主切.jpg','自然长侧片公主切','公主切','美发站','https://www.meifazhan.com/lxfx/liuhai/186605.html','侧片长度接近下颌，沙龙环境自然，切线与长发连接清楚。'),
            ('04','04_公主切.jpg','04_棕色柔和公主切.jpg','棕色柔和公主切','公主切','美发站','https://www.meifazhan.com/lxfx/liuhai/186605.html','棕色长发、薄刘海与柔和侧片，保留公主切断层但降低锋利度。'),
            ('05','05_公主切.jpg','05_短侧片齐刘海公主切.jpg','短侧片齐刘海公主切','公主切','美发站','https://www.meifazhan.com/lxfx/liuhai/186605.html','短齐侧片形成近似Bob的前部框架，后部长发继续下垂。'),
            ('07','07_公主切.jpg','07_长直挑染公主切.jpg','长直挑染公主切','公主切','美发站','https://www.meifazhan.com/lxfx/liuhai/186605.html','长直发主体干净，脸周切线较长，发尾轻微挑染提供层次。'),
            ('08','08_公主切.jpg','08_齐刘海长发公主切.jpg','齐刘海长发公主切','公主切','美发站','https://www.meifazhan.com/lxfx/liuhai/186605.html','齐刘海、脸侧短片和胸下长发三层结构同时可见。'),
            ('10','10_层次长发.jpg','10_黑发高层次锁骨发.jpg','黑发高层次锁骨发','层次长发','新浪刘丽丽','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','黑发锁骨长度，脸周和发尾形成多级羽毛层，轮廓清楚。'),
            ('11','11_层次长发.jpg','11_暖棕高层次中长发.jpg','暖棕高层次中长发','层次长发','新浪刘丽丽','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','暖棕中长发，颧骨至锁骨连续递进，发尾轻而不碎。'),
            ('13','13_层次长发.jpg','13_黑茶长层次发.jpg','黑茶长层次发','层次长发','新浪刘丽丽','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','黑茶长发保持长轴，脸周层次从下颌向胸前展开。'),
            ('14','14_层次长发.jpg','14_黑发侧面层次发.jpg','黑发侧面层次发','层次长发','新浪刘丽丽','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','侧面角度清楚展示顶部、脸周和发尾层次的连接。'),
            ('15','15_层次长发.jpg','15_黑发脸周层次长发.jpg','黑发脸周层次长发','层次长发','新浪刘丽丽','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','脸周弧线与胸前长层同时成立，适合观察柔和高层次结构。'),
          ]

          for _,src,dst,*_ in items:
              s=cand/src
              if not s.exists(): raise SystemExit(f'missing selected candidate: {s}')
              shutil.copy2(s,sel/dst)

          nodes=[]; edges=[]
          nodes.append({'id':'title','type':'text','text':'# 高质量中国平台女性发型人像图源池｜R1\n\n**正式入选：12张｜公主切7张｜层次长发5张**\n\n研究对象是中国发型平台、中文时尚渠道与沙龙传播链中的高质量女性发型人像，不依据外貌判断模特国籍。\n\n图片均已本地化；来源页可确认，但多数原始摄影师／沙龙账号仍待反查，因此统一标记 `upstream-pending`。','x':-900,'y':-900,'width':1800,'height':480,'color':'4'})
          groups={
            '公主切':{'id':'group-hime','x':-2500,'y':-250,'width':5000,'height':2500,'color':'2','label':'A｜公主切高质量人像渠道｜7张'},
            '层次长发':{'id':'group-layer','x':-2500,'y':2500,'width':5000,'height':1900,'color':'6','label':'B｜层次长发高质量人像渠道｜5张'},
          }
          for g in groups.values(): nodes.append({'id':g['id'],'type':'group','x':g['x'],'y':g['y'],'width':g['width'],'height':g['height'],'color':g['color'],'label':g['label']})

          counters={'公主切':0,'层次长发':0}
          for cid,src,dst,title,kind,channel,url,note in items:
              i=counters[kind]; counters[kind]+=1
              base_y=0 if kind=='公主切' else 2750
              col=i%3; row=i//3
              x=-2350+col*1600; y=base_y+row*780
              fid=f'ref-{cid}'; card=f'card-{cid}'
              nodes.append({'id':fid,'type':'file','file':str(sel/dst),'x':x,'y':y,'width':520,'height':650})
              text=(f'# {cid}｜{title}\n\n**类型：** {kind}\n**渠道：** {channel}\n\n{note}\n\n[打开来源页面]({url})\n\n**证据状态：** `image-present / source-page-confirmed / upstream-pending`\n\n**用途：** 图源质量与发型视觉参考；不能仅凭模特颜值判定发型结构等级。')
              nodes.append({'id':card,'type':'text','text':text,'x':x+570,'y':y,'width':820,'height':650,'color':'3' if kind=='公主切' else '6'})
              edges.append({'id':f'e-{cid}','fromNode':fid,'fromSide':'right','toNode':card,'toSide':'left'})

          nodes.append({'id':'audit','type':'text','text':'# R1筛选审计\n\n## 入选规则\n- 真人发型人像，发型主体清楚\n- 本地图片边长不低于450px\n- 构图、光线和面部完成度达到沙龙样片或高质量生活人像水平\n- 来源页可打开并能与图片对应\n\n## 淘汰\n- 06：道具和风遮挡发型结构\n- 09：滤镜与轮廓稳定性不足\n- 12：与同组高度重复，前部遮挡较重\n\n## 未完成\n原始美发师、沙龙、摄影师或社交账号仍需R2/R3继续反查。','x':-900,'y':4550,'width':1800,'height':850,'color':'5'})
          canvas={'nodes':nodes,'edges':edges,'metadata':{'version':'1.0-1.0','frontmatter':{}}}
          (root/'高质量中国女性发型人像图源池.canvas').write_text(json.dumps(canvas,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest=['# R1 高质量中国平台女性发型人像图源池｜正式清单','',f'- 正式入选：{len(items)}张','- 公主切：7张','- 层次长发：5张','- 状态：`image-present / source-page-confirmed / upstream-pending`','']
          for cid,src,dst,title,kind,channel,url,note in items:
              manifest += [f'## {cid}｜{title}',f'- 类型：{kind}',f'- 渠道：{channel}',f'- 本地文件：`assets/refs/r1_china_source_pool/selected/{dst}`',f'- 来源页：{url}',f'- 结构说明：{note}',f'- 状态：`image-present / source-page-confirmed / upstream-pending`','']
          manifest += ['## 淘汰记录','- 06：道具与风遮挡发型结构。','- 09：滤镜与轮廓稳定性不足。','- 12：与同组重复且前部遮挡较重。','']
          (root/'R1_高质量中国平台发型图源池_正式清单.md').write_text('\n'.join(manifest),encoding='utf-8')

          # 更新渠道说明
          channel_path=root/'高质量中国女性发型图源渠道.md'
          channel_text=channel_path.read_text(encoding='utf-8')
          block='''\n\n## R1执行结果（2026-08-03）\n\n- 初筛候选：15张；\n- 自动下载与尺寸验证通过：15张；\n- 人工审美与结构筛选后正式入选：12张；\n- 已建立：`高质量中国女性发型人像图源池.canvas`；\n- 已本地化到：`assets/refs/r1_china_source_pool/selected/`；\n- 当前来源等级：来源页确认，上游作者／沙龙账号待反查。\n\nR1只完成图源池与质量基线，不替代发型结构S级审计。\n'''
          if '## R1执行结果（2026-08-03）' not in channel_text:
              channel_path.write_text(channel_text.rstrip()+block,encoding='utf-8')

          # 更新总索引
          index_path=root/'女性发型库_总索引.canvas'
          index=json.loads(index_path.read_text(encoding='utf-8'))
          index.setdefault('metadata',{})['version']='1.0-1.0'
          index['metadata'].setdefault('frontmatter',{})
          if not any(n.get('id')=='r1-source-pool' for n in index.get('nodes',[])):
              index['nodes'] += [
                {'id':'r1-source-pool','type':'file','file':str(root/'高质量中国女性发型人像图源池.canvas'),'x':-1250,'y':3100,'width':560,'height':760},
                {'id':'r1-source-manifest','type':'file','file':str(root/'R1_高质量中国平台发型图源池_正式清单.md'),'x':-630,'y':3100,'width':430,'height':760},
                {'id':'r1-source-card','type':'text','text':'## R1｜高质量中国平台女性发型图源池｜12张\n\n公主切7张、层次长发5张。图片已本地化，来源页已确认；原始美发师／沙龙／摄影账号仍待反查。\n\n状态：`image-present / source-page-confirmed / upstream-pending`。','x':-140,'y':3100,'width':980,'height':760,'color':'2'}
              ]
              index['edges'] += [
                {'id':'e-r1-title','fromNode':'title','fromSide':'bottom','toNode':'r1-source-pool','toSide':'top'},
                {'id':'e-r1-manifest','fromNode':'r1-source-pool','fromSide':'right','toNode':'r1-source-manifest','toSide':'left'},
                {'id':'e-r1-card','fromNode':'r1-source-manifest','fromSide':'right','toNode':'r1-source-card','toSide':'left'}
              ]
          for n in index.get('nodes',[]):
              if n.get('id')=='title':
                  n['text']=n.get('text','').replace('本地可见配图：30项','本地可见图片：42张')
              if n.get('id')=='status' and 'R1图源池' not in n.get('text',''):
                  n['text']=n.get('text','').replace('- **合计：30项**','- 批次03/04/06/07：30张\n- R1高质量中国平台图源池：12张\n- **本地可见图片合计：42张**')
          index_path.write_text(json.dumps(index,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 保留候选联系表与清单用于审计，删除15张候选副本，避免重复占库
          if cand.exists(): shutil.rmtree(cand)
          print('R1 finalized:',len(items),'selected')
          PY

      - name: Validate R1 outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f '05-银矿库/角色库/发型库总表/高质量中国女性发型人像图源池.canvas'
          test -f '05-银矿库/角色库/发型库总表/R1_高质量中国平台发型图源池_正式清单.md'
          count=$(find '05-银矿库/角色库/发型库总表/assets/refs/r1_china_source_pool/selected' -type f | wc -l)
          test "$count" -eq 12
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('05-银矿库/角色库/发型库总表')
          for p in [root/'高质量中国女性发型人像图源池.canvas',root/'女性发型库_总索引.canvas']:
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['metadata']['version']=='1.0-1.0',p
          print('R1 outputs valid')
          PY

      - name: Commit finalized R1 pool
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R1：完成高质量中国平台女性发型图源池'
          git push origin HEAD:"$BRANCH"
