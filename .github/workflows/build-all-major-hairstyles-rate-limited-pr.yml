name: Build All Major Hairstyles Rate Limited PR

on:
  pull_request:
    branches: [main]
    paths:
      - '05-银矿库/角色库/发型库总表/.batch05-rate-limited-trigger'

permissions:
  contents: write

concurrency:
  group: hair-major-types-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-rate-limited:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            05-银矿库/角色库/发型库总表
          sparse-checkout-cone-mode: false

      - name: Run all 40 types with rate limiting and backoff
        run: python '05-银矿库/角色库/发型库总表/tools/run_all_major_hairstyles_rate_limited.py'

      - name: Validate generated family canvases and assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path('05-银矿库/角色库/发型库总表')
          canvases = sorted((root / '批次05_主要类型一次跑完').glob('*.canvas'))
          if len(canvases) != 6:
              raise SystemExit(f'expected 6 family canvases, got {len(canvases)}')
          for path in canvases:
              data = json.loads(path.read_text(encoding='utf-8'))
              if not data.get('nodes'):
                  raise SystemExit(f'empty canvas: {path}')
          assets = list((root / 'assets/refs/batch05').glob('*'))
          manifest = (root / '批次05_自动检索与许可清单.md').read_text(encoding='utf-8')
          success = manifest.count('| candidate-image |')
          missing = manifest.count('| evidence-pending |')
          if success + missing != 40:
              raise SystemExit(f'manifest count mismatch: success={success} missing={missing}')
          if success < 15:
              raise SystemExit(f'too few image candidates after backoff: {success}')
          index = json.loads((root / '女性发型库_总索引.canvas').read_text(encoding='utf-8'))
          if not any(n.get('id') == 'batch05-summary' for n in index.get('nodes', [])):
              raise SystemExit('batch05 index node missing')
          print(f'validated canvases={len(canvases)} assets={len(assets)} success={success} missing={missing}')
          PY

      - name: Rebase and commit generated results
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '05-银矿库/角色库/发型库总表'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m '发型库：一次跑完40种主要类型与本地候选配图'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
