name: Hair R1 Candidate Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '05-银矿库/角色库/发型库总表/.r1-artifact-trigger'

permissions:
  contents: read

jobs:
  upload-r1-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            05-银矿库/角色库/发型库总表/assets/refs/r1_china_source_pool
          sparse-checkout-cone-mode: false

      - uses: actions/upload-artifact@v4
        with:
          name: r1-hair-candidates
          path: 05-银矿库/角色库/发型库总表/assets/refs/r1_china_source_pool
          if-no-files-found: error
          retention-days: 7
