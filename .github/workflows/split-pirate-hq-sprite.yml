name: Split HQ pirate sprite

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Split native-resolution tiles
        run: python scripts/split_pirate_hq_sprite.py
      - name: Validate HQ manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('09-给674（我）用的库/画画理论/assets/海盗航海_is-a名词素材库/HQ_MANIFEST.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['asset_count'] == 16, data
          assert all(x['width'] == 256 and x['height'] == 256 for x in data['assets']), data
          assert all(x['bytes'] > 15000 for x in data['assets']), data
          PY
      - name: Commit HQ JPG assets
        run: |
          git config user.name "canvas-asset-bot"
          git config user.email "canvas-asset-bot@users.noreply.github.com"
          git rm -f tmp/pirate_hq_sprite_1024.jpg
          git rm -f scripts/split_pirate_hq_sprite.py
          git rm -f .github/workflows/split-pirate-hq-sprite.yml
          git add "09-给674（我）用的库/画画理论/assets/海盗航海_is-a名词素材库"
          git commit -m "[hq-assets] replace blurry pirate JPGs with native 256px crops"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
