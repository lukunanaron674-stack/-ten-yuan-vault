name: Build Fashion Image Canvases PR

on:
  pull_request:
    branches: [main]
    paths:
      - '14-角色库/现代服装库/06_现代名牌服装真实图片URL库/.fashion-image-pr-trigger'

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose current Vogue page structure
        working-directory: '14-角色库/现代服装库/06_现代名牌服装真实图片URL库'
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.request import Request, urlopen
          data = json.loads(Path('collections.json').read_text(encoding='utf-8'))
          url = data['collections'][0]['base_url']
          req = Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml',
              'Accept-Encoding': 'identity',
          })
          with urlopen(req, timeout=60) as response:
              html = response.read().decode('utf-8', errors='replace')
          print('PAGE_URL', url)
          print('PAGE_LENGTH', len(html))
          for token in ['CollectionSlide', 'photosTout', 'slidesV2', 'assets.vogue.com/photos', '__NEXT_DATA__', 'collection']:
              print('TOKEN', token, 'COUNT', html.count(token), 'FIRST', html.find(token))
          for token in ['CollectionSlide', 'photosTout', 'assets.vogue.com/photos']:
              pos = html.find(token)
              if pos >= 0:
                  snippet = html[max(0, pos-400):pos+1000].replace('\n', ' ')
                  print('SNIPPET', token, snippet[:1400])
          urls = re.findall(r'https?:\\?/\\?/assets\\?\.vogue\\?\.com\\?/photos\\?/[^"<> ]+', html)
          print('RAW_ASSET_URL_MATCHES', len(urls))
          for item in urls[:10]:
              print('ASSET_SAMPLE', item[:500])
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.I|re.S)
          print('SCRIPT_COUNT', len(scripts))
          for attrs, body in sorted(scripts, key=lambda x: len(x[1]), reverse=True)[:8]:
              print('SCRIPT', attrs[:300], 'LENGTH', len(body), 'HEAD', body[:180].replace('\n',' '))
          PY

      - name: Fetch 1000 real Vogue image URLs
        working-directory: '14-角色库/现代服装库/06_现代名牌服装真实图片URL库'
        run: |
          set -euo pipefail
          python scrape_vogue_image_records.py \
            --collections collections.json \
            --output image_records.json

      - name: Build Obsidian Canvas galleries
        working-directory: '14-角色库/现代服装库/06_现代名牌服装真实图片URL库'
        run: |
          set -euo pipefail
          rm -rf generated_canvases
          python build_fashion_image_canvases.py \
            --input image_records.json \
            --output-dir generated_canvases

      - name: Validate output
        working-directory: '14-角色库/现代服装库/06_现代名牌服装真实图片URL库'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('image_records.json').read_text(encoding='utf-8'))
          assert data['total_records'] == 1000, data.get('total_records')
          assert len(data['records']) == 1000
          assert len({r['image_url'] for r in data['records']}) == 1000
          canvases = list(Path('generated_canvases').glob('*.canvas'))
          detail = [p for p in canvases if p.name != '00_真实图片总索引.canvas']
          assert detail, '没有生成分系列Canvas'
          assert all('![](http' in p.read_text(encoding='utf-8') for p in detail)
          print(f'validated: 1000 image URLs, {len(canvases)} canvases')
          PY

      - name: Commit generated records to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            '14-角色库/现代服装库/06_现代名牌服装真实图片URL库/image_records.json' \
            '14-角色库/现代服装库/06_现代名牌服装真实图片URL库/generated_canvases'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m '生成1000套现代服装真实图片Canvas'
          git push origin HEAD:${{ github.head_ref }}
