name: One-shot merge water hair candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/merge-water-hair.trigger'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge xz and nz candidates into water canvas
        run: |
          python - <<'PY'
          from __future__ import annotations

          import copy
          import json
          import re
          from pathlib import Path

          water_path = Path('14-角色库/刘海98种/02_五行十元重组/五行库/水/水_xz-nz.canvas')
          candidate_path = Path('14-角色库/刘海98种/03_狭义视觉复审/水_xz-nz_各10张URL候选.canvas')
          trigger_path = Path('.github/merge-water-hair.trigger')

          if not candidate_path.exists():
              print('Candidate canvas already merged or absent; nothing to do.')
              trigger_path.unlink(missing_ok=True)
              raise SystemExit(0)

          water = json.loads(water_path.read_text(encoding='utf-8'))
          candidate = json.loads(candidate_path.read_text(encoding='utf-8'))

          if any(marker in water_path.read_text(encoding='utf-8') for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise RuntimeError('Water canvas contains unresolved conflict markers.')
          if any(marker in candidate_path.read_text(encoding='utf-8') for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise RuntimeError('Candidate canvas contains unresolved conflict markers.')

          existing_ids = {str(node.get('id')) for node in water.get('nodes', [])}
          if any(node_id.startswith('supp-') for node_id in existing_ids):
              raise RuntimeError('Supplement nodes already exist; refusing a duplicate merge.')

          for node in water.get('nodes', []):
              if node.get('id') == 'group-阳':
                  node['label'] = '旧迁移 xz｜9项｜legacy-pending-review'
              elif node.get('id') == 'group-阴':
                  node['label'] = '原库 nz｜1项｜旧迁移研究卡'
              elif node.get('id') == 'title':
                  node['text'] = (
                      '# 水库｜xz ↔ nz｜原库＋狭义视觉补充配图版\n\n'
                      '**五行轴：** 可逆性与对象特异回返空间\n'
                      '**层级规则：** 命运 --is-a狭义[domain=叙事]→ 水；五行是广义父项，主题是叙事狭义子项。\n'
                      '**原98种映射材料：** 10项，其中旧 `xz` 9项均为 `legacy-pending-review`，原 `nz` 1项保留。\n'
                      '**新增狭义视觉候选：** `xz` 10张＋`nz` 10张，编号使用 `XZ-R`／`NZ-R`，不占用98种原编号。\n'
                      '**Canvas可见总数：** 30张。\n'
                      '**图片策略：** 保存图片URL与来源页URL；不复制第三方原图。\n'
                      '**状态：** 新增20项均为 `provisional-candidate`，逐图终审后才能进入正式排行榜。'
                  )
                  node['width'] = 2500
                  node['height'] = 720

          id_map: dict[str, str] = {'title': 'title'}
          supplement_nodes = []
          for node in candidate.get('nodes', []):
              old_id = str(node.get('id'))
              if old_id == 'title':
                  continue
              new_node = copy.deepcopy(node)
              new_id = f'supp-{old_id}'
              id_map[old_id] = new_id
              new_node['id'] = new_id
              new_node['x'] = int(new_node.get('x', 0)) + 4200
              if old_id == 'xz-group':
                  new_node['label'] = '新增 xz｜10张URL候选｜provisional-candidate'
              elif old_id == 'nz-group':
                  new_node['label'] = '新增 nz｜10张URL候选｜provisional-candidate'
              elif old_id.startswith('xz'):
                  new_node['text'] = new_node.get('text', '').replace(
                      f'## XZ-{old_id[-2:]}｜', f'## XZ-R{old_id[-2:]}｜', 1
                  )
              elif old_id.startswith('nz'):
                  new_node['text'] = new_node.get('text', '').replace(
                      f'## NZ-{old_id[-2:]}｜', f'## NZ-R{old_id[-2:]}｜', 1
                  )
              supplement_nodes.append(new_node)

          supplement_edges = []
          for edge in candidate.get('edges', []):
              new_edge = copy.deepcopy(edge)
              new_edge['id'] = f"supp-{edge.get('id')}"
              from_id = str(edge.get('fromNode'))
              to_id = str(edge.get('toNode'))
              new_edge['fromNode'] = id_map.get(from_id, f'supp-{from_id}')
              new_edge['toNode'] = id_map.get(to_id, f'supp-{to_id}')
              supplement_edges.append(new_edge)

          supplement_edges.extend([
              {
                  'id': 'edge-title-supp-xz-group',
                  'fromNode': 'title',
                  'fromSide': 'bottom',
                  'toNode': 'supp-xz-group',
                  'toSide': 'top'
              },
              {
                  'id': 'edge-title-supp-nz-group',
                  'fromNode': 'title',
                  'fromSide': 'bottom',
                  'toNode': 'supp-nz-group',
                  'toSide': 'top'
              }
          ])

          water.setdefault('nodes', []).extend(supplement_nodes)
          water.setdefault('edges', []).extend(supplement_edges)
          water['metadata'] = {
              'version': '1.1-water-supplement',
              'status': 'shape-review-active',
              'original_research_count': 10,
              'legacy_xz_count': 9,
              'original_nz_count': 1,
              'supplement_xz_count': 10,
              'supplement_nz_count': 10,
              'visible_total': 30,
              'canonical_supplement': False,
              'updated': '2026-08-04'
          }

          rendered = json.dumps(water, ensure_ascii=False, separators=(',', ':'))
          reparsed = json.loads(rendered)

          node_ids = {str(node.get('id')) for node in reparsed.get('nodes', [])}
          expected_xz = {f'supp-xz{i:02d}' for i in range(1, 11)}
          expected_nz = {f'supp-nz{i:02d}' for i in range(1, 11)}
          if not expected_xz.issubset(node_ids):
              raise RuntimeError(f'Missing xz supplement nodes: {sorted(expected_xz - node_ids)}')
          if not expected_nz.issubset(node_ids):
              raise RuntimeError(f'Missing nz supplement nodes: {sorted(expected_nz - node_ids)}')

          supplement_text = '\n'.join(
              str(node.get('text', ''))
              for node in reparsed.get('nodes', [])
              if str(node.get('id', '')).startswith('supp-')
          )
          image_urls = re.findall(r'!\[\]\((https?://[^)]+)\)', supplement_text)
          source_pages = re.findall(r'\*\*来源页：\*\* \[[^\]]+\]\((https?://[^)]+)\)', supplement_text)
          if len(image_urls) != 20 or len(set(image_urls)) != 20:
              raise RuntimeError(f'Supplement image validation failed: total={len(image_urls)}, unique={len(set(image_urls))}')
          if len(source_pages) != 20:
              raise RuntimeError(f'Source page validation failed: {len(source_pages)}/20')

          water_path.write_text(rendered, encoding='utf-8')
          candidate_path.unlink()
          trigger_path.unlink(missing_ok=True)
          print('Merged candidates into water canvas: xz=10, nz=10, images=20, sources=20.')
          PY

      - name: Commit merged water canvas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '14-角色库/刘海98种/02_五行十元重组/五行库/水/水_xz-nz.canvas' \
                  '14-角色库/刘海98种/03_狭义视觉复审/水_xz-nz_各10张URL候选.canvas' \
                  '.github/merge-water-hair.trigger'
          if git diff --cached --quiet; then
            echo 'No merge changes.'
          else
            git commit -m '将xz与nz各10张URL候选并入水库 [skip bangs-rebuild]'
            git push origin main
          fi
