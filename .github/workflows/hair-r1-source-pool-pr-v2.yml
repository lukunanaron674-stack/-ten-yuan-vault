name: Hair R1 China Source Pool v2

on:
  pull_request:
    branches: [main]
    paths:
      - '05-银矿库/角色库/发型库总表/.r1-source-pool-trigger'

permissions:
  contents: write

jobs:
  collect-candidates-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            05-银矿库/角色库/发型库总表
            .github/workflows/hair-r1-source-pool-pr.yml
          sparse-checkout-cone-mode: false

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Execute existing R1 collector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path

          workflow = Path('.github/workflows/hair-r1-source-pool-pr.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'r1_collector.py', 'exec'), {})
          PYCODE

      - name: Commit R1 candidates
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No R1 candidate changes.'
            exit 0
          fi
          git commit -m 'R1：下载高质量中国平台发型候选与联系表'
          git push origin HEAD:"$BRANCH"
