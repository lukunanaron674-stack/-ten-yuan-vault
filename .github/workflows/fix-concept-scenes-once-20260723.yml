name: One-shot concept scene correction

on:
  schedule:
    - cron: '45 8 23 7 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rewrite all concept scene sections
        run: python scripts/fix_all_concept_scene_sections_once.py

      - name: Validate all top-level concept Canvas files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('09-给674（我）用的库/概念库')
          files = sorted(root.glob('*_is-a名词素材库.canvas'))
          if len(files) != 20:
              raise SystemExit(f'expected 20 canvases, got {len(files)}')
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              nodes = data.get('nodes')
              edges = data.get('edges')
              if not isinstance(nodes, list) or not isinstance(edges, list):
                  raise SystemExit(f'invalid Canvas arrays: {path}')
              ids = [str(node.get('id')) for node in nodes]
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'duplicate node IDs: {path}')
              scene_headers = [node for node in nodes if str(node.get('text', '')).startswith('🌄 场景 is-a')]
              if len(scene_headers) != 1 or '可绘制场景类目' not in scene_headers[0].get('text', ''):
                  raise SystemExit(f'scene section not corrected: {path}')
          print('validated 20 corrected Canvas files')
          PY

      - name: Remove one-shot workflow after success
        run: git rm .github/workflows/fix-concept-scenes-once-20260723.yml

      - name: Commit and push
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '09-给674（我）用的库/概念库/' scripts/fix_all_concept_scene_sections_once.py .github/workflows/fix-concept-scenes-once-20260723.yml
          git commit -m 'fix(canvas): replace all incorrect concept scene sections'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
