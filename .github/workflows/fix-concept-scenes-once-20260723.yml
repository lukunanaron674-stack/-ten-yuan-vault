name: One-shot concept scene correction

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-concept-scenes-once-20260723.yml'
      - 'scripts/fix_current_concept_scene_sections.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-concept-scene-correction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rewrite current concept scene sections
        run: python scripts/fix_current_concept_scene_sections.py

      - name: Independently validate all top-level concept Canvas files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('09-给674（我）用的库/概念库')
          files = sorted(root.glob('*_is-a名词素材库.canvas'))
          forbidden = ('v2 状态侵蚀层', 'v3 内部功能空间', 'v4 复合场景层')
          if len(files) != 20:
              raise SystemExit(f'expected 20 canvases, got {len(files)}')
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              nodes = data.get('nodes')
              edges = data.get('edges')
              if not isinstance(nodes, list) or not isinstance(edges, list):
                  raise SystemExit(f'invalid Canvas arrays: {path}')
              ids = [str(node.get('id')) for node in nodes]
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'duplicate node IDs: {path}')
              headers = [node for node in nodes if str(node.get('text', '')).startswith('🌄 场景 is-a')]
              if len(headers) != 1:
                  raise SystemExit(f'scene header count invalid: {path}')
              scene_text = '\n'.join(str(node.get('text', '')) for node in nodes)
              if any(term in scene_text for term in forbidden):
                  raise SystemExit(f'legacy scene chain remains: {path}')

          marker = root / '.scene-sections-fixed-20260729'
          report = root / '场景区全库修复报告_2026-07-29.md'
          if not marker.exists() or not report.exists():
              raise SystemExit('repair marker/report missing')
          counts = {}
          for line in marker.read_text(encoding='utf-8').splitlines():
              key, value = line.split('=', 1)
              counts[key] = int(value)
          if counts.get('scanned') != 20:
              raise SystemExit(f'invalid scanned count: {counts}')
          if counts.get('legacy', 0) < 1 or counts.get('changed') != counts.get('legacy'):
              raise SystemExit(f'incomplete repair counts: {counts}')
          if counts.get('preserved', 0) + counts.get('changed', 0) != 20:
              raise SystemExit(f'invalid repair partition: {counts}')
          print(f'validated 20 Canvas files: {counts}')
          PY

      - name: Commit corrected Canvas files to PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '09-给674（我）用的库/概念库/'
          if git diff --cached --quiet; then
            echo 'No correction needed.'
            exit 0
          fi
          git commit -m 'fix(canvas): replace all incorrect concept scene sections'
          git push origin HEAD:"${HEAD_REF}"
