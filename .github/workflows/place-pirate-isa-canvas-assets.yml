name: Place pirate is-a Canvas assets

on:
  push:
    branches:
      - agent/pirate-isa-canvas-assets

permissions:
  contents: write

jobs:
  place-assets:
    if: ${{ !contains(github.event.head_commit.message, '[canvas-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pirate-isa-canvas-assets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Place existing assets into Canvas
        run: python scripts/place_pirate_isa_canvas_assets.py
      - name: Commit Canvas update
        run: |
          git config user.name "canvas-asset-bot"
          git config user.email "canvas-asset-bot@users.noreply.github.com"
          git add "09-给674（我）用的库/画画理论/海盗航海_is-a名词素材库.canvas"
          if git diff --cached --quiet; then
            echo "Canvas already up to date"
            exit 0
          fi
          git commit -m "[canvas-bot] place pirate painterly assets in is-a Canvas"
          git push origin HEAD:agent/pirate-isa-canvas-assets
