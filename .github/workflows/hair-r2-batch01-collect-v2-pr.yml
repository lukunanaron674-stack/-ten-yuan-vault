name: Hair R2 Batch01 Collect v2

on:
  pull_request:
    branches: [main]
    paths:
      - '05-银矿库/角色库/发型库总表/.r2-batch01-trigger'

permissions:
  contents: write

jobs:
  collect-batch01-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            05-银矿库/角色库/发型库总表
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Retry Commons with throttling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, time, re, html
          from pathlib import Path
          import requests
          from PIL import Image, ImageDraw, ImageFont

          root=Path('05-银矿库/角色库/发型库总表')
          out=root/'assets/refs/batch01_r2/candidates'
          out.mkdir(parents=True,exist_ok=True)
          items=[
            ('01','马尾','直顺马尾','Indian woman in ponytail.jpg'),
            ('02','马尾','发束包裹马尾','Hair Wrapped Ponytail.JPG'),
            ('03','马尾','分节马尾','Sectioned Ponytail.JPG'),
            ('04','短发','经典波波头','Woman with bob haircut.jpg'),
            ('05','短发','精灵短发','Pixie haircut.jpg'),
            ('06','短发','长波波头','Woman with long bob haircut from behind.png'),
            ('07','卷发','自然卷','Curly hair.jpg'),
            ('08','卷发','大体量卷发','Woman with big curly hairstyle.jpg'),
            ('09','卷发','蓬松卷发','Voluminous curly hairstyle.jpg'),
            ('10','公主切','经典公主切','Hime cut.jpg'),
            ('11','公主切','长侧片公主切','Cosplayer of Asuna Yuuki, Sword Art Online 20140830.jpg'),
            ('12','公主切','柔化公主切','Cosplayer of Kotori Minami at CWT41 20151212a.jpg'),
            ('13','双马尾','经典双马尾','Pigtails.jpg'),
            ('14','双马尾','长双马尾','A girl with twin tails; January 2016 (04).jpg'),
            ('15','双马尾','编织双马尾','Braided pigtails.jpg'),
            ('16','狼尾','狼尾示例','Wolftail Hairstyle Example.jpg'),
            ('17','狼尾','现代狼剪',"Woman with wolfcut and Foxhound jacket at Tokyo Station on New Year's Eve.jpg"),
            ('18','狼尾','现代鲻鱼近邻','Modern Mullet.jpg'),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'ten-yuan-vault-hair-research/1.1 (educational catalog; contact via repository)'})

          def get_retry(url,*,params=None,binary=False):
              last=''
              for attempt in range(7):
                  try:
                      r=s.get(url,params=params,timeout=70)
                      if r.status_code in (429,500,502,503,504):
                          last=f'HTTP {r.status_code}'; time.sleep(min(45,5*(attempt+1))); continue
                      r.raise_for_status()
                      return r.content if binary else r.json()
                  except Exception as e:
                      last=str(e); time.sleep(min(45,5*(attempt+1)))
              raise RuntimeError(last)

          def clean(v):
              return html.unescape(re.sub('<[^>]+>','',v or '')).strip()

          rows=[]; thumbs=[]
          for idx,(cid,family,title,file_title) in enumerate(items):
              row={'id':cid,'family':family,'title':title,'commons_file':file_title,'status':'failed'}
              try:
                  params={'action':'query','format':'json','formatversion':'2','titles':'File:'+file_title,'prop':'imageinfo','iiprop':'url|size|mime|extmetadata'}
                  data=get_retry('https://commons.wikimedia.org/w/api.php',params=params)
                  page=data['query']['pages'][0]
                  if page.get('missing') is not None or not page.get('imageinfo'): raise RuntimeError('Commons file missing')
                  info=page['imageinfo'][0]; meta=info.get('extmetadata',{})
                  raw=get_retry(info['url'],binary=True)
                  im=Image.open(io.BytesIO(raw)); im.load(); w,h=im.size
                  if im.mode not in ('RGB','L'):
                      bg=Image.new('RGB',im.size,'white')
                      if 'A' in im.getbands(): bg.paste(im,mask=im.getchannel('A'))
                      else: bg.paste(im)
                      im=bg
                  else: im=im.convert('RGB')
                  path=out/f'{cid}_{family}_{title}.jpg'; im.save(path,quality=92,optimize=True)
                  row.update({'status':'downloaded','dimensions':f'{w}x{h}','file':str(path),'source_page':info.get('descriptionurl',''),'image_url':info['url'],'author':clean(meta.get('Artist',{}).get('value','')),'license':meta.get('LicenseShortName',{}).get('value',''),'credit':clean(meta.get('Credit',{}).get('value',''))})
                  th=im.copy(); th.thumbnail((360,440)); thumbs.append((cid,family,title,th))
              except Exception as e: row['reason']=str(e)[:260]
              rows.append(row)
              time.sleep(4)

          cols=3; cw=440; ch=560; rn=max(1,(len(thumbs)+cols-1)//cols)
          sheet=Image.new('RGB',(cols*cw,rn*ch),'white'); draw=ImageDraw.Draw(sheet)
          try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',20)
          except: font=ImageFont.load_default()
          for i,(cid,family,title,th) in enumerate(thumbs):
              x=(i%cols)*cw; y=(i//cols)*ch
              sheet.paste(th,(x+(cw-th.width)//2,y+8)); draw.rectangle((x,y,x+cw-1,y+ch-1),outline='black',width=2)
              draw.text((x+14,y+458),f'{cid} | {family}',fill='black',font=font); draw.text((x+14,y+492),title,fill='black',font=font)
          d=root/'assets/refs/batch01_r2'; d.mkdir(parents=True,exist_ok=True); sheet.save(d/'R2_批次01候选联系表.jpg',quality=90)
          (root/'R2_批次01候选清单.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          md=['# R2 批次01候选清单','',f'- 目标：{len(items)}张',f'- 成功下载：{sum(r["status"]=="downloaded" for r in rows)}张','- v2采用单项限速与指数退避；仍需人工审美和结构筛选。','']
          for r in rows:
              md += [f'## {r["id"]}｜{r["family"]}｜{r["title"]}',f'- Commons文件：`{r["commons_file"]}`',f'- 状态：`{r["status"]}`',f'- 尺寸：{r.get("dimensions","未知")}',f'- 作者：{r.get("author") or "未解析"}',f'- 许可：{r.get("license") or "未解析"}',f'- 来源页：{r.get("source_page","未解析")}',f'- 本地文件：`{r.get("file","未保存")}`',f'- 失败原因：{r.get("reason","") or "无"}','']
          (root/'R2_批次01候选清单.md').write_text('\n'.join(md),encoding='utf-8')
          print({'downloaded':sum(r['status']=='downloaded' for r in rows),'total':len(rows)})
          PY

      - name: Commit v2 candidates
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R2：限速重试批次01候选'
          git push origin HEAD:"$BRANCH"

      - uses: actions/upload-artifact@v4
        with:
          name: r2-batch01-candidates-v2
          path: 05-银矿库/角色库/发型库总表/assets/refs/batch01_r2
          if-no-files-found: error
          retention-days: 7
