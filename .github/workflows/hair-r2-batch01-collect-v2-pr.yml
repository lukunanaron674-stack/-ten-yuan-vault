name: Hair R2 Batch01 Clean Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - '05-银矿库/角色库/发型库总表/.r2-clean-finalize-trigger'

permissions:
  contents: write

jobs:
  finalize-r2-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            05-银矿库/角色库/发型库总表
            14-角色库/ZX/assets/refs
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Build clean R2 outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil, io, time
          from pathlib import Path
          import requests
          from PIL import Image

          root=Path('05-银矿库/角色库/发型库总表')
          selected=root/'assets/refs/batch01_r2/selected'
          selected.mkdir(parents=True,exist_ok=True)

          downloads={
            '01_马尾_直顺马尾.jpg':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Indian%20woman%20in%20ponytail.jpg?width=1200',
            '02_马尾_发束包裹马尾.jpg':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hair%20Wrapped%20Ponytail.JPG?width=1200',
            '03_马尾_分节马尾.jpg':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sectioned%20Ponytail.JPG?width=1200',
            '09_卷发_蓬松卷发.jpg':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Voluminous%20curly%20hairstyle.jpg?width=1200',
            '15_双马尾_长双马尾.jpg':'https://commons.wikimedia.org/wiki/Special:Redirect/file/A%20girl%20with%20twin%20tails%3B%20January%202016%20%2804%29.jpg?width=1200',
          }
          s=requests.Session(); s.headers.update({'User-Agent':'ten-yuan-vault-hair-research/1.3'})
          for name,url in downloads.items():
              dst=selected/name
              if dst.exists(): continue
              last=''
              for attempt in range(9):
                  try:
                      r=s.get(url,timeout=90)
                      if r.status_code in (429,500,502,503,504):
                          last=f'HTTP {r.status_code}'; time.sleep(min(60,8*(attempt+1))); continue
                      r.raise_for_status(); im=Image.open(io.BytesIO(r.content)); im.load(); im.convert('RGB').save(dst,quality=92,optimize=True); break
                  except Exception as e:
                      last=str(e); time.sleep(min(60,8*(attempt+1)))
              if not dst.exists(): raise SystemExit(f'failed download {name}: {last}')
              time.sleep(6)

          copies={
            '04_短发_精灵短发.jpg':Path('14-角色库/ZX/assets/refs/zx_03_modern_pixie.jpg'),
            '05_短发_渐层Bob.jpg':Path('14-角色库/ZX/assets/refs/zx_06_graduated_bob.jpg'),
            '06_短发_齐切Bob.jpg':root/'assets/refs/batch04/04_11_blunt_bob.jpg',
            '07_卷发_中长卷发.jpg':root/'assets/refs/batch04/04_02_curly_hair.jpg',
            '08_卷发_Afro圆形自然卷.jpg':root/'assets/refs/batch04/04_08_afro.jpg',
            '10_公主切_经典中分公主切.jpg':root/'assets/refs/r1_china_source_pool/selected/01_经典中分公主切.jpg',
            '11_公主切_棕色柔化公主切.jpg':root/'assets/refs/r1_china_source_pool/selected/04_棕色柔和公主切.jpg',
            '12_公主切_齐刘海长发公主切.jpg':root/'assets/refs/r1_china_source_pool/selected/08_齐刘海长发公主切.jpg',
            '13_双马尾_低双马尾.jpg':root/'assets/refs/batch04/04_04_pigtails.jpg',
            '14_双马尾_贴头双辫.jpg':Path('14-角色库/ZX/assets/refs/zx_02_boxer_braids.jpg'),
            '16_狼尾_Mixie短狼尾.jpg':Path('14-角色库/ZX/assets/refs/zx_09_mixie_cut.jpg'),
            '17_狼尾_顺直长层轻狼尾.jpg':root/'assets/refs/batch07_hush_direction/07_01_possible_original.jpg',
            '18_狼尾_长款Hush轻狼尾.jpg':root/'assets/refs/batch07_hush_direction/07_03_long_hush_cut.jpg',
          }
          for name,src in copies.items():
              if not src.exists(): raise SystemExit(f'missing source: {src}')
              shutil.copy2(src,selected/name)

          items=[
            ('01','马尾','直顺马尾','01_马尾_直顺马尾.jpg','https://commons.wikimedia.org/wiki/File:Indian_woman_in_ponytail.jpg','单束低中位马尾，主体直顺垂落。'),
            ('02','马尾','发束包裹马尾','02_马尾_发束包裹马尾.jpg','https://commons.wikimedia.org/wiki/File:Hair_Wrapped_Ponytail.JPG','发束包覆主束点，隐藏发圈并强化束点。'),
            ('03','马尾','分节马尾','03_马尾_分节马尾.jpg','https://commons.wikimedia.org/wiki/File:Sectioned_Ponytail.JPG','尾部由多个束点分节，形成泡泡式节奏。'),
            ('04','短发','精灵短发','04_短发_精灵短发.jpg','https://www.allure.com/story/pixie-haircut','耳侧与后颈显著缩短，顶部保留短层。'),
            ('05','短发','渐层Bob','05_短发_渐层Bob.jpg','https://www.elle.com/beauty/hair/a65352286/graduated-bob-hairstyles/','后短前长，后脑堆叠形成斜向重量线。'),
            ('06','短发','齐切Bob','06_短发_齐切Bob.jpg','https://commons.wikimedia.org/wiki/File:Woman_with_bob_haircut.jpg','下缘近水平齐切，重量线完整。'),
            ('07','卷发','中长卷发','07_卷发_中长卷发.jpg','https://commons.wikimedia.org/wiki/File:Woman_with_curly_brown_hairstyle.jpg','中等卷径沿中长发重复形成C弯与S波。'),
            ('08','卷发','Afro圆形自然卷','08_卷发_Afro圆形自然卷.jpg','https://commons.wikimedia.org/wiki/File:Natural_redhead_black_girl_(red_power_hairstyle).jpg','紧密自然卷向四周扩张，形成圆形大体量。'),
            ('09','卷发','蓬松卷发','09_卷发_蓬松卷发.jpg','https://commons.wikimedia.org/wiki/File:Voluminous_curly_hairstyle.jpg','高蓬松量与重复卷组并存。'),
            ('10','公主切','经典中分公主切','10_公主切_经典中分公主切.jpg','https://www.meifazhan.com/lxfx/liuhai/186605.html','中分额面与下颌平切侧片并存。'),
            ('11','公主切','棕色柔化公主切','11_公主切_棕色柔化公主切.jpg','https://www.meifazhan.com/lxfx/liuhai/186605.html','硬切侧片被薄刘海与棕色长发柔化。'),
            ('12','公主切','齐刘海长发公主切','12_公主切_齐刘海长发公主切.jpg','https://www.meifazhan.com/lxfx/liuhai/186605.html','齐刘海、脸侧短片、胸下长发三层清楚。'),
            ('13','双马尾','低双马尾','13_双马尾_低双马尾.jpg','https://commons.wikimedia.org/wiki/File:Smiling_woman_with_pigtails.JPG','左右两个低位束点，尾部自然垂落。'),
            ('14','双马尾','贴头双辫','14_双马尾_贴头双辫.jpg','https://www.allure.com/gallery/box-braids-hair-inspiration','左右双轨贴头编织，作为双束编发子型。'),
            ('15','双马尾','长双马尾','15_双马尾_长双马尾.jpg','https://commons.wikimedia.org/wiki/File:A_girl_with_twin_tails;_January_2016_(04).jpg','左右高位长束点，长尾向两侧垂落。'),
            ('16','狼尾','Mixie短狼尾','16_狼尾_Mixie短狼尾.jpg','https://www.allure.com/story/mixie-mullet-pixie-haircut-trend','耳侧短层与后颈长尾并置。'),
            ('17','狼尾','顺直长层轻狼尾','17_狼尾_顺直长层轻狼尾.jpg','https://thebeautyfoodie.com/korean-wolf-cut/','长直主体中加入轻碎层和柔和尾部。'),
            ('18','狼尾','长款Hush轻狼尾','18_狼尾_长款Hush轻狼尾.jpg','https://www.mujerhoy.com/belleza/pelo/corte-hush-cut-tendencia-pelo-otono-2023-20230923114458-nt.html','羽毛脸周层、轻冠部体量与细长发尾并存。'),
          ]

          groups=[('马尾','5'),('短发','6'),('卷发','3'),('公主切','2'),('双马尾','1'),('狼尾','5')]
          nodes=[{'id':'title','type':'text','text':'# 女性发型库总表｜批次01 R2正式收口版\n\n**18张本地可见图｜6个家族×3种子型**\n\n旧远程热链已退役。本版复用05库已核验资产、R1高质量图源池与少量开放许可候选；全部改为 `type:file`。\n\n图片可见不自动等于S级canonical，当前状态统一为 `image-present / source-confirmed / audit-pending`。','x':-850,'y':-900,'width':1700,'height':430,'color':'4'}]
          edges=[]; positions={}
          for gi,(fam,color) in enumerate(groups):
              row=gi//3; col=gi%3; gx=-3000+col*2050; gy=-250+row*2250
              nodes.append({'id':f'group-{gi}','type':'group','x':gx,'y':gy,'width':1850,'height':1950,'color':color,'label':f'{fam}｜R2本地正式子型'})
              positions[fam]=(gx,gy,color)
          counters={f:0 for f,_ in groups}
          for cid,family,title,name,source,note in items:
              path=selected/name; gx,gy,color=positions[family]; i=counters[family]; counters[family]+=1
              x=gx+80+i*580; y=gy+130; fid=f'ref-{cid}'; card=f'card-{cid}'
              nodes.append({'id':fid,'type':'file','file':str(path),'x':x,'y':y,'width':500,'height':720})
              nodes.append({'id':card,'type':'text','text':f'# {cid}｜{title}\n\n**家族：** {family}\n\n{note}\n\n[打开来源页面]({source})\n\n**证据状态：** `image-present / source-confirmed / audit-pending`','x':x,'y':y+770,'width':500,'height':520,'color':color})
              edges.append({'id':f'e-{cid}','fromNode':fid,'fromSide':'bottom','toNode':card,'toSide':'top'})
          nodes.append({'id':'audit','type':'text','text':'# R2审计\n\n- 18个远程热链节点全部退役\n- 18张图片全部转为05库本地文件节点\n- 6个家族各3个结构差异明确的子型\n- 来源链接保留\n- metadata固定为 `1.0-1.0`\n\n旧10号低分辨率假发模特图已淘汰。后续R4再做S/A级结构与许可审计。','x':-900,'y':4300,'width':1800,'height':700,'color':'4'})
          canvas={'nodes':nodes,'edges':edges,'metadata':{'version':'1.0-1.0','frontmatter':{}}}
          (root/'女性发型库总表_真实网络参考子型批次01.canvas').write_text(json.dumps(canvas,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          md=['# R2 批次01正式来源清单','',f'- 正式本地图：{len(items)}张','- 家族：马尾、短发、卷发、公主切、双马尾、狼尾','- 状态：`image-present / source-confirmed / audit-pending`','']
          for cid,family,title,name,source,note in items:
              md += [f'## {cid}｜{family}｜{title}',f'- 本地文件：`{selected/name}`',f'- 来源：{source}',f'- 结构：{note}','']
          (root/'R2_批次01正式来源清单.md').write_text('\n'.join(md),encoding='utf-8')

          index_path=root/'女性发型库_总索引.canvas'; index=json.loads(index_path.read_text(encoding='utf-8'))
          index.setdefault('metadata',{})['version']='1.0-1.0'; index['metadata'].setdefault('frontmatter',{})
          for n in index.get('nodes',[]):
              if n.get('id')=='title': n['text']=n.get('text','').replace('本地可见图片：42张','本地图片节点：60个')
              if n.get('id')=='batch01-card': n['text']='## 批次01｜R2正式收口｜18张本地图\n\n马尾、短发、卷发、公主切、双马尾、狼尾各3张。旧热链已退役，全部改为05库本地 `type:file`。\n\n状态：`image-present / source-confirmed / audit-pending`。'
              if n.get('id')=='status': n['text']=n.get('text','').replace('- **本地可见图片合计：42张**','- 批次01 R2：18张本地节点\n- **本地图片节点合计：60个**')
          if not any(n.get('id')=='r2-manifest' for n in index.get('nodes',[])):
              index['nodes'].append({'id':'r2-manifest','type':'file','file':str(root/'R2_批次01正式来源清单.md'),'x':440,'y':700,'width':480,'height':650})
              index['edges'].append({'id':'e-r2-manifest','fromNode':'batch01','fromSide':'right','toNode':'r2-manifest','toSide':'left'})
          index_path.write_text(json.dumps(index,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate clean R2
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('05-银矿库/角色库/发型库总表')
          c=json.loads((root/'女性发型库总表_真实网络参考子型批次01.canvas').read_text(encoding='utf-8'))
          files=[n for n in c['nodes'] if n.get('type')=='file']
          assert len(files)==18
          assert all(Path(n['file']).exists() for n in files)
          assert c['metadata']['version']=='1.0-1.0'
          idx=json.loads((root/'女性发型库_总索引.canvas').read_text(encoding='utf-8'))
          assert idx['metadata']['version']=='1.0-1.0'
          print('R2 clean validated:',len(files))
          PY

      - name: Commit clean R2
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R2：干净收口批次01为18张本地配图'
          git push origin HEAD:"$BRANCH"
