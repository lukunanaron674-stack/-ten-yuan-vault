name: canvas-n32-repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canvas-n32-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and patch Canvas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "canvas-reference-bot"
          git config user.email "canvas-reference-bot@users.noreply.github.com"
          python - <<'PY'
          import json, pathlib
          canvas_path = pathlib.Path('09-给674（我）用的库/概念库/游牧流浪_is-a名词素材库.canvas')
          note_path = pathlib.Path('09-给674（我）用的库/画画理论/assets/游牧流浪_is-a名词素材库/n32_风帐营地废墟_reference.md')
          if not note_path.exists():
              raise SystemExit('reference note missing')
          data = json.loads(canvas_path.read_text(encoding='utf-8'))
          old_nodes = list(data['nodes'])
          old_edges = list(data['edges'])
          node_ids = [n['id'] for n in old_nodes]
          edge_ids = [e['id'] for e in old_edges]
          if len(node_ids) != len(set(node_ids)) or len(edge_ids) != len(set(edge_ids)):
              raise SystemExit('preexisting duplicate ids')
          concept = next((n for n in old_nodes if n.get('id') == 'n32' and n.get('type') == 'text'), None)
          if concept is None:
              raise SystemExit('n32 missing')
          ref = next((n for n in old_nodes if n.get('id') == 'ref_n32'), None)
          edge = next((e for e in old_edges if e.get('id') == 'e_ref_n32'), None)
          expected_ref = {
              'id':'ref_n32','type':'file',
              'file':'09-给674（我）用的库/画画理论/assets/游牧流浪_is-a名词素材库/n32_风帐营地废墟_reference.md',
              'x':-1610,'y':-500,'width':340,'height':260
          }
          expected_edge = {
              'id':'e_ref_n32','fromNode':'n32','fromSide':'left',
              'toNode':'ref_n32','toSide':'right','label':'参考图'
          }
          if ref is not None and ref != expected_ref:
              raise SystemExit('ref_n32 exists with conflicting content')
          if edge is not None and edge != expected_edge:
              raise SystemExit('e_ref_n32 exists with conflicting content')
          if ref is None:
              data['nodes'].append(expected_ref)
          if edge is None:
              data['edges'].append(expected_edge)
          if data['nodes'][:len(old_nodes)] != old_nodes or data['edges'][:len(old_edges)] != old_edges:
              raise SystemExit('old canvas content changed before write')
          node_ids2 = [n['id'] for n in data['nodes']]
          edge_ids2 = [e['id'] for e in data['edges']]
          if len(node_ids2) != len(set(node_ids2)) or len(edge_ids2) != len(set(edge_ids2)):
              raise SystemExit('duplicate ids after patch')
          canvas_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          verify = json.loads(canvas_path.read_text(encoding='utf-8'))
          assert verify['nodes'][:len(old_nodes)] == old_nodes
          assert verify['edges'][:len(old_edges)] == old_edges
          assert sum(n.get('id') == 'ref_n32' for n in verify['nodes']) == 1
          assert sum(e.get('id') == 'e_ref_n32' for e in verify['edges']) == 1
          PY
          git add '09-给674（我）用的库/概念库/游牧流浪_is-a名词素材库.canvas'
          git commit -m 'canvas: link n32 reference note'
          git push origin HEAD:main
          CANVAS_COMMIT=$(git rev-parse HEAD)
          CANVAS_BLOB=$(git rev-parse "HEAD:09-给674（我）用的库/概念库/游牧流浪_is-a名词素材库.canvas")
          export CANVAS_COMMIT CANVAS_BLOB
          python - <<'PY'
          import json, os, pathlib, datetime
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).replace(microsecond=0)
          iso = now.isoformat()
          stamp = now.strftime('%Y%m%dT%H%M%S%z')
          state_path = pathlib.Path('04-F12总控载体/canvas-single-image-pipeline/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state.update({
              'phase':'reference_canvas_linked',
              'status':'completed_remote_verified',
              'lastHeartbeat':iso,
              'lastError':None,
              'nextAction':'下一轮先核对 n32 远端成果与历史 completed 项，再按 y → x → node id 扫描下一个合格概念。',
              'committed':True,'pushed':True,'remoteVerified':True,'canvasLinked':True,
              'canvasNodeId':'ref_n32','canvasEdgeId':'e_ref_n32',
              'canvasBlobSha':os.environ['CANVAS_BLOB'],
              'verifiedCommit':os.environ['CANVAS_COMMIT']
          })
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          rec = pathlib.Path(f'04-F12总控载体/canvas-single-image-pipeline/run-ledger.d/{now:%Y-%m}/{stamp}__n32__completed.md')
          rec.parent.mkdir(parents=True, exist_ok=True)
          if rec.exists():
              raise SystemExit('ledger record path already exists')
          rec.write_text(f'''# Canvas 参考图运行记录\n\n- 时间：{iso}\n- Canvas：09-给674（我）用的库/概念库/游牧流浪_is-a名词素材库.canvas\n- 节点：n32 风帐营地废墟\n- 结果：completed\n- 参考笔记：09-给674（我）用的库/画画理论/assets/游牧流浪_is-a名词素材库/n32_风帐营地废墟_reference.md\n- 来源页：https://commons.wikimedia.org/wiki/File:Kel_Ajjer_nomad_camp.jpg\n- 参考提交：57c7eb2d7d16c9ff0fddc41bb2061a8d5c16ec34\n- Canvas 提交：{os.environ['CANVAS_COMMIT']}\n- Canvas blob：{os.environ['CANVAS_BLOB']}\n- 状态提交：pending-next-commit\n- 远端读回：工作流在推送 Canvas 后重新读取并验证 n32、ref_n32、e_ref_n32、参考笔记与唯一 ID。\n- 失败原因：none\n- 下一动作：下一轮先核对 n32 远端成果，再扫描下一个合格概念。\n''', encoding='utf-8')
          pathlib.Path('/tmp/ledger_path').write_text(str(rec), encoding='utf-8')
          PY
          LEDGER_PATH=$(cat /tmp/ledger_path)
          git add '04-F12总控载体/canvas-single-image-pipeline/state.json' "$LEDGER_PATH"
          git commit -m 'canvas: finalize n32 state and ledger'
          git push origin HEAD:main
          STATE_COMMIT=$(git rev-parse HEAD)
          RECORD_BLOB=$(git rev-parse "HEAD:$LEDGER_PATH")
          export STATE_COMMIT RECORD_BLOB LEDGER_PATH
          python - <<'PY'
          import json, os, pathlib
          latest_path = pathlib.Path('04-F12总控载体/canvas-single-image-pipeline/run-ledger-latest.json')
          latest = json.loads(latest_path.read_text(encoding='utf-8'))
          state = json.loads(pathlib.Path('04-F12总控载体/canvas-single-image-pipeline/state.json').read_text(encoding='utf-8'))
          latest['latestRecord'] = {
              'path':os.environ['LEDGER_PATH'],
              'time':state['lastHeartbeat'],
              'canvasPath':state['canvasPath'],
              'nodeId':'n32','conceptName':'风帐营地废墟','result':'completed',
              'recordCommit':os.environ['STATE_COMMIT'],
              'verifiedCommit':state['verifiedCommit'],
              'canvasBlobSha':state['canvasBlobSha'],
              'recordBlobSha':os.environ['RECORD_BLOB']
          }
          latest['nextAction'] = '下一轮先核对 n32 当前 main 成果，再按稳定顺序扫描下一个合格概念。'
          latest_path.write_text(json.dumps(latest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add '04-F12总控载体/canvas-single-image-pipeline/run-ledger-latest.json'
          git commit -m 'canvas: advance latest ledger pointer for n32'
          git push origin HEAD:main
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, pathlib
          canvas = json.loads(pathlib.Path('09-给674（我）用的库/概念库/游牧流浪_is-a名词素材库.canvas').read_text(encoding='utf-8'))
          state = json.loads(pathlib.Path('04-F12总控载体/canvas-single-image-pipeline/state.json').read_text(encoding='utf-8'))
          latest = json.loads(pathlib.Path('04-F12总控载体/canvas-single-image-pipeline/run-ledger-latest.json').read_text(encoding='utf-8'))
          assert sum(n.get('id') == 'ref_n32' for n in canvas['nodes']) == 1
          assert sum(e.get('id') == 'e_ref_n32' for e in canvas['edges']) == 1
          assert state['remoteVerified'] is True and state['canvasLinked'] is True
          assert latest['latestRecord']['nodeId'] == 'n32' and latest['latestRecord']['result'] == 'completed'
          assert pathlib.Path(latest['latestRecord']['path']).exists()
          PY
