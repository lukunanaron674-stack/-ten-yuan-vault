name: Temporary Build 1000 Hairstyle ZIPs

on:
  pull_request:
    paths:
      - '_temporary_hair_zip_trigger.txt'

concurrency:
  group: temporary-hairstyle-zip-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests pillow

      - name: Build five ZIP bundles
        run: python tools/_temporary_build_1000_hair_zips_v5.py

      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('hair_zip_output/BUILD_SUMMARY.json').read_text(encoding='utf-8'))
          assert summary['total_images'] == 1000, summary
          zips = sorted(Path('hair_zip_output').glob('*.zip'))
          assert len(zips) == 5, zips
          for path in zips:
              assert path.stat().st_size > 5_000_000, (path, path.stat().st_size)
          print(summary)
          PY

      - name: Upload five ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hairstyle-1000-images-five-zips
          path: |
            hair_zip_output/*.zip
            hair_zip_output/BUILD_SUMMARY.json
          compression-level: 0
          retention-days: 7
