name: Hair R1 China Source Pool

on:
  pull_request:
    branches: [main]
    paths:
      - '05-银矿库/角色库/发型库总表/.r1-source-pool-trigger'

permissions:
  contents: write

jobs:
  collect-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            05-银矿库/角色库/发型库总表
          sparse-checkout-cone-mode: false

      - name: Download and validate R1 candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, time
          from pathlib import Path
          import requests
          from PIL import Image, ImageDraw, ImageFont

          root = Path('05-银矿库/角色库/发型库总表')
          out = root / 'assets/refs/r1_china_source_pool/candidates'
          out.mkdir(parents=True, exist_ok=True)

          candidates = [
            ('01','经典公主切-中分长侧片','公主切','https://www.meifazhan.com/uploads/220808/65_104434_1.png','https://www.meifazhan.com/lxfx/liuhai/186605.html','美发站'),
            ('02','经典公主切-时尚发色','公主切','https://www.meifazhan.com/uploads/220808/65_104434_2.png','https://www.meifazhan.com/lxfx/liuhai/186605.html','美发站'),
            ('03','多段式公主切','公主切','https://www.meifazhan.com/uploads/220808/65_104434_3.png','https://www.meifazhan.com/lxfx/liuhai/186605.html','美发站'),
            ('04','棕色柔和公主切','公主切','https://www.meifazhan.com/uploads/220808/65_104434_4.png','https://www.meifazhan.com/lxfx/liuhai/186605.html','美发站'),
            ('05','韩式公主切','公主切','https://www.meifazhan.com/uploads/220808/65_104434_5.png','https://www.meifazhan.com/lxfx/liuhai/186605.html','美发站'),
            ('06','演员公主切参考','公主切','https://www.meifazhan.com/uploads/220808/65_104434_6.png','https://www.meifazhan.com/lxfx/liuhai/186605.html','美发站'),
            ('07','线条感挑染公主切','公主切','https://www.meifazhan.com/uploads/220808/65_104434_7.png','https://www.meifazhan.com/lxfx/liuhai/186605.html','美发站'),
            ('08','漫画刘海公主切','公主切','https://www.meifazhan.com/uploads/220808/65_104434_8.png','https://www.meifazhan.com/lxfx/liuhai/186605.html','美发站'),
            ('09','边沿层次长发-正面','层次长发','https://k.sinaimg.cn/n/sinakd20112/704/w1024h1280/20240930/dbfd-59f26be8fda5a64dbbddf372ad163f8f.jpg/w700d1q75cms.jpg','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','新浪刘丽丽'),
            ('10','边沿层次长发-侧层','层次长发','https://k.sinaimg.cn/n/sinakd20112/704/w1024h1280/20240930/d3c8-185700adb048938e323f2b77f79cd3cf.jpg/w700d1q75cms.jpg','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','新浪刘丽丽'),
            ('11','边沿层次长发-轻薄','层次长发','https://k.sinaimg.cn/n/sinakd20112/704/w1024h1280/20240930/b2b1-2c379dd2b8dd69dbdd2111aaebc16405.jpg/w700d1q75cms.jpg','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','新浪刘丽丽'),
            ('12','边沿层次长发-发尾弧度','层次长发','https://k.sinaimg.cn/n/sinakd20112/704/w1024h1280/20240930/818a-26f08eadc51ab4bd1f183f89024dbaec.jpg/w700d1q75cms.jpg','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','新浪刘丽丽'),
            ('13','边沿层次长发-长轴','层次长发','https://k.sinaimg.cn/n/sinakd20112/704/w1024h1280/20240930/13a1-ad91c9b9036bc21aec2feb03d7379cea.jpg/w700d1q75cms.jpg','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','新浪刘丽丽'),
            ('14','边沿层次长发-自然卷尾','层次长发','https://k.sinaimg.cn/n/sinakd20112/704/w1024h1280/20240930/1535-3efb4b7dd8d025b72b7ceb59ad4c210e.jpg/w700d1q75cms.jpg','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','新浪刘丽丽'),
            ('15','边沿层次长发-脸周层','层次长发','https://k.sinaimg.cn/n/sinakd20112/704/w1024h1280/20240930/1af1-94efa76c418eb149949158a549991e3f.jpg/w700d1q75cms.jpg','https://k.sina.cn/article_5018498246_12b2034c600101io8o.html','新浪刘丽丽'),
          ]

          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'})
          rows=[]
          thumbs=[]
          for cid,title,kind,url,source,channel in candidates:
              status='failed'; reason=''; dims=''; saved=''
              headers={'Referer': source, 'Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'}
              for attempt in range(4):
                  try:
                      r=session.get(url,headers=headers,timeout=35)
                      if r.status_code == 429:
                          time.sleep(4*(attempt+1)); continue
                      r.raise_for_status()
                      im=Image.open(io.BytesIO(r.content))
                      im.load()
                      w,h=im.size; dims=f'{w}x{h}'
                      if w < 450 or h < 450:
                          status='rejected-small'; reason='低于450px门槛'; break
                      if im.mode not in ('RGB','L'):
                          bg=Image.new('RGB',im.size,'white')
                          if 'A' in im.getbands(): bg.paste(im,mask=im.getchannel('A'))
                          else: bg.paste(im)
                          im=bg
                      else:
                          im=im.convert('RGB')
                      path=out/f'{cid}_{kind}.jpg'
                      im.save(path,quality=92,optimize=True)
                      saved=str(path)
                      status='downloaded'
                      thumb=im.copy(); thumb.thumbnail((360,460))
                      thumbs.append((cid,title,kind,thumb))
                      break
                  except Exception as e:
                      reason=str(e)[:180]
                      time.sleep(2*(attempt+1))
              rows.append({'id':cid,'title':title,'kind':kind,'channel':channel,'status':status,'dimensions':dims,'file':saved,'image_url':url,'source_page':source,'reason':reason})

          # 联系表
          cols=3; cell_w=430; cell_h=570
          rows_n=max(1,(len(thumbs)+cols-1)//cols)
          sheet=Image.new('RGB',(cols*cell_w,rows_n*cell_h),'white')
          draw=ImageDraw.Draw(sheet)
          try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',22)
          except: font=ImageFont.load_default()
          for i,(cid,title,kind,thumb) in enumerate(thumbs):
              x=(i%cols)*cell_w; y=(i//cols)*cell_h
              sheet.paste(thumb,(x+(cell_w-thumb.width)//2,y+10))
              draw.rectangle((x,y,x+cell_w-1,y+cell_h-1),outline='black',width=2)
              draw.text((x+16,y+480),f'{cid} | {kind}',fill='black',font=font)
              draw.text((x+16,y+515),title,fill='black',font=font)
          sheet_path=root/'assets/refs/r1_china_source_pool/R1_候选联系表.jpg'
          sheet_path.parent.mkdir(parents=True,exist_ok=True)
          sheet.save(sheet_path,quality=90)

          (root/'R1_高质量中国平台发型候选清单.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          md=['# R1 高质量中国平台发型候选清单','',f'- 候选总数：{len(candidates)}',f'- 成功下载且过尺寸门槛：{sum(r["status"]=="downloaded" for r in rows)}','- 当前仅为候选，未完成审美筛选和上游作者核验。','']
          for r in rows:
              md += [f'## {r["id"]}｜{r["title"]}',f'- 类型：{r["kind"]}',f'- 渠道：{r["channel"]}',f'- 状态：`{r["status"]}`',f'- 尺寸：{r["dimensions"] or "未知"}',f'- 来源页：{r["source_page"]}',f'- 图片地址：{r["image_url"]}',f'- 本地文件：{r["file"] or "未保存"}',f'- 备注：{r["reason"] or "待人工审美筛选"}','']
          (root/'R1_高质量中国平台发型候选清单.md').write_text('\n'.join(md),encoding='utf-8')
          print(json.dumps({'downloaded':sum(r['status']=='downloaded' for r in rows),'total':len(rows)},ensure_ascii=False))
          if sum(r['status']=='downloaded' for r in rows) < 8:
              raise SystemExit('R1 downloaded fewer than 8 usable candidates')
          PY

      - name: Commit R1 candidates
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R1：下载高质量中国平台发型候选与联系表'
          git push origin HEAD:"$BRANCH"
