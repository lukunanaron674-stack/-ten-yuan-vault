<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Mock — F12 Playwright Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; background: #1a1a1e; color: #e0e0e0; }
    #prompt-textarea { width: 100%; min-height: 80px; padding: 12px; border: 1px solid #444; border-radius: 8px; background: #222; color: #eee; font-size: 14px; }
    button { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; }
    button[data-testid="send-button"] { background: #2563eb; color: #fff; }
    button[data-testid="stop-button"] { background: #991b1b; color: #fff; }
    [data-message-author-role="assistant"] { padding: 16px; background: #222228; border-radius: 8px; margin: 10px 0; min-height: 40px; }
  </style>
</head>
<body>
  <h2>ChatGPT Mock Page</h2>
  <p>F12 Playwright Fixture — 模拟 ChatGPT 页面 DOM 结构</p>

  <div style="display:flex;gap:10px;align-items:flex-end">
    <textarea id="prompt-textarea" placeholder="输入消息..."></textarea>
    <button data-testid="send-button" aria-label="发送">发送</button>
  </div>

  <button data-testid="stop-button" aria-label="停止生成" style="display:none;margin:10px 0">停止</button>

  <div data-message-author-role="assistant">
    <p>Mock assistant reply. Content script should detect this node.</p>
  </div>

  <div data-message-author-role="assistant">
    <p>Second assistant reply for stability testing.</p>
  </div>

  <script>
    // Simulate sending behavior
    document.querySelector('[data-testid="send-button"]').addEventListener('click', () => {
      const input = document.getElementById('prompt-textarea');
      if (!input.value.trim()) return;
      const stopBtn = document.querySelector('[data-testid="stop-button"]');
      stopBtn.style.display = 'inline-block';
      // 模拟 3 秒生成
      setTimeout(() => {
        stopBtn.style.display = 'none';
        const assistant = document.querySelector('[data-message-author-role="assistant"]');
        assistant.innerHTML += '<p>Generated reply to: ' + input.value.substring(0, 30) + '...</p>';
        input.value = '';
      }, 3000);
    });
  </script>
</body>
</html>
