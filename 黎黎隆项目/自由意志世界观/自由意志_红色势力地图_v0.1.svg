  <text x="40" y="50" font-size="15" font-weight="500" fill="#2C2C2A" font-family="sans-serif">红色势力地图 v0.1（红桶视角，底图=世界总图）</text>

  <rect x="40" y="70" width="600" height="340" rx="16" fill="#CDE7E6" stroke="#142A34" stroke-width="0.5"/>

