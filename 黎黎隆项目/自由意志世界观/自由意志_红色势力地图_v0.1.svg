  <text x="52" y="366" font-size="11" fill="#501313" font-family="sans-serif">暗红虚线=O4 航路网（R5 为枢纽）</text>

  <g font-family="sans-serif">
    <text x="40" y="446" font-size="14" font-weight="500" fill="#2C2C2A">图例（红桶视角）</text>
    <rect x="40" y="462" width="14" height="14" rx="3" fill="#913840"/>
    <text x="60" y="473" font-size="12" fill="#444441">R5 自由锚港：O4 船队大本营 + O3 通告网枢纽 + O6 限入市场</text>
    <rect x="40" y="486" width="14" height="14" rx="3" fill="#F2EFE4" stroke="#913840" stroke-width="1.2"/>
    <text x="60" y="497" font-size="12" fill="#444441">R2 遗骨之地：夺路×回返原型场（探索/朝圣/共采）</text>
    <path d="M40 514 l14 0" stroke="#913840" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="60" y="521" font-size="12" fill="#444441">O4 航路网 · O3 通告板（红旗）· O2 寺院（离船挂单）</text>
    <rect x="350" y="486" width="14" height="14" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="370" y="497" font-size="12" fill="#444441">R1 青方腹地：对峙面，不主动开战</text>
  </g>

  <rect x="40" y="548" width="600" height="60" rx="10" fill="#FCEBEB" stroke="#913840" stroke-width="0.5"/>
  <text x="58" y="572" font-size="12" fill="#501313" font-family="sans-serif">红方战略：不占国、不立都——据点（锚港）+网络（通告）+航路（船队），组织即生活方式。</text>
  <text x="58" y="592" font-size="12" fill="#501313" font-family="sans-serif">锁定句：红色反对的不是改造，而是别人替你决定你的身体。</text>
</svg>
