<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F12 总监面板 v2.0</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:ui-sans-serif,system-ui;font-size:12px;background:#0f0f13;color:#ddd;padding:10px;min-width:300px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .header h1{font-size:14px;color:#fff}
    .conn{font-size:10px;padding:2px 8px;border-radius:10px}
    .conn.online{background:#1a3a1a;color:#4f4}
    .conn.offline{background:#3a1a1a;color:#f44}
    .section{margin-bottom:10px;background:#1a1a22;border-radius:8px;padding:8px}
    .section-title{font-size:11px;font-weight:700;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
    .btn-row{display:flex;gap:4px;margin-bottom:4px}
    button{padding:5px 10px;border:0;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}
    .btn-primary{background:#2563eb;color:#fff}
    .btn-warn{background:#d97706;color:#fff}
    .btn-stop{background:#dc2626;color:#fff}
    .btn-go{background:#16a34a;color:#fff}
    .btn-sm{padding:3px 8px;font-size:10px}
    .btn-ghost{background:transparent;border:1px solid #333;color:#aaa}
    .btn-inject{background:#7c3aed;color:#fff;font-size:10px;padding:3px 6px}
    .script-card{background:#252530;border-radius:6px;padding:6px 8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
    .script-info{flex:1;min-width:0}
    .script-name{font-weight:700;color:#fff;font-size:11px}
    .script-desc{color:#888;font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tab-row{background:#252530;border-radius:6px;padding:6px 8px;margin-bottom:4px}
    .tab-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
    .tab-title{font-weight:600;color:#fff;font-size:11px}
    .tab-status{font-size:10px;padding:1px 6px;border-radius:8px}
    .tab-status.running{background:#1a3a1a;color:#4f4}
    .tab-status.idle{background:#333;color:#aaa}
    .tab-status.stopped{background:#3a1a1a;color:#f44}
    .tab-status.done{background:#1a2a3a;color:#4af}
    .tab-progress{font-size:10px;color:#aaa;margin-top:2px}
    .tab-actions{display:flex;gap:3px;margin-top:4px}
    .log-line{font-size:10px;color:#666;padding:1px 0;border-bottom:1px solid #1a1a22}
    .log-line .ts{color:#444}
    .empty{color:#555;font-size:10px;text-align:center;padding:8px}
    .divider{border-top:1px solid #2a2a35;margin:6px 0}
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>🧭 F12 总监面板</h1>
    <span id="conn" class="conn offline">桥离线</span>
  </div>

  <!-- 连接控制 -->
  <div class="section">
    <div class="section-title">📡 连接</div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-bind">绑定当前标签</button>
      <button class="btn-warn" id="btn-inject">注入工蜂</button>
      <button class="btn-ghost" id="btn-refresh">刷新</button>
    </div>
    <div id="bind-info" style="font-size:10px;color:#666;margin-top:4px">未绑定</div>
  </div>

  <!-- 脚本库 -->
  <div class="section">
    <div class="section-title">📦 浏览器端脚本</div>
    <div id="script-library">
      <div class="empty">加载中...</div>
    </div>
  </div>

  <!-- 活跃标签 -->
  <div class="section">
    <div class="section-title">📋 活跃标签</div>
    <div id="active-tabs">
      <div class="empty">等待页面注册...</div>
    </div>
  </div>

  <!-- 日志 -->
  <div class="section">
    <div class="section-title">📜 日志</div>
    <div id="logs" style="max-height:120px;overflow:auto"></div>
  </div>
</div>
<script src="sidepanel-v2.js"></script>
</body>
</html>
